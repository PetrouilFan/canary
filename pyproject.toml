[project]
name = "canary"
version = "0.1.0"
description = "Canary - minimal, modular, self-improving personal agent harness"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
embeddings = [
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "tokenizers>=0.20",
    "huggingface_hub>=0.24",
]
fastembed = ["fastembed>=0.4"]
watch = ["watchdog>=4.0"]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
]

[project.scripts]
canary = "canary.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["canary"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"canary.api" = { msg = "core/ must never import api/ (spec 3.5)" }

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["TID251"]
"canary/cli.py" = ["TID251"]
"canary/__main__.py" = ["TID251"]
"canary/api/**" = ["TID251", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["canary"]

[tool.pytest.ini_options]
timeout = 120
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: spawns processes/servers; excluded from staging preflight",
]
